syntax = "proto2";


option java_package = "Env";
option java_outer_classname = "DeviceEnv";


enum Platform
{
  ANDROID = 0;
  IOS = 1;
  WINDOWS_PHONE = 2;
  BLACKBERRY = 3;
  BLACKBERRYX = 4;
  S40 = 5;
  S60 = 6;
  PYTHON_CLIENT = 7;
  TIZEN = 8;
  ENTERPRISE = 9;
  SMB_ANDROID = 10;
  KAIOS = 11;
  SMB_IOS = 12;
  WINDOWS = 13;
  WEB = 14;
  PAGE = 23;
}

message AppVersion
{
  optional int32 primary_ = 1;
  optional int32 secondary_ = 2;
  optional int32 tertiary_ = 3;
  optional int32 quaternary_ = 4;
  optional int32 quinary_ = 5;
}

enum ReleaseChannel
{
  RELEASE = 0;
  BETA = 1;
  ALPHA = 2;
  DEBUG = 3;
}
enum DeviceType {
  PHONE = 0;
  TABLET = 1;
  DESKTOP = 2;
  WEARABLE = 3;
  VR = 4;
}
message UserAgent
{
  optional Platform platform_ = 1;
  optional AppVersion appVersion_ = 2;
  optional string mcc_ = 3;
  optional string mnc_ = 4;
  optional string osVersion_ = 5;
  optional string manufacturer_ = 6;
  optional string device_ = 7;
  //ro.build.description
  optional string osBuildNumber_ = 8;  //Build.DISPLAY
  optional string phoneId_ = 9;
  optional ReleaseChannel releaseChannel_ = 10;
  optional string localeLanguageIso6391_ = 11;
  optional string localeCountryIso31661Alpha2_ = 12;
  optional string cpu_chip = 13; //Build.BOARD
  //安卓uuid，带横线
  optional string deviceExpId = 14;
  //固定PHONE
  optional DeviceType deviceType = 15;
  optional string deviceModelType = 16;
}

message KeyPair
{
  required bytes strPubKey = 1;
  required bytes strPrivateKey = 2;
}


message AndroidEnv
{
  required string fullphone = 1;
  required KeyPair client_static_keyPair = 2; //保存在xml 里面的
  optional string pushname = 3;
  optional bytes server_static_public = 4;
  //设备 generateDeviceId
  required bytes expid = 5;
  //phone id_
  required string fdid = 6;
  optional bytes edge_routing_info = 7;
  optional string chat_dns_domain = 8;
  optional UserAgent userAgent_ = 9;
  optional  bool passive = 10;
  //注册需要用到，保存起来，注册都需要
  optional int32 pid = 11;
  //运营商 China Mobile GSM
  optional string network_operator_name = 12;
  optional int32 connection_lc = 13;
  //backup_token
  optional bytes backup_token = 14;
  //orignal token
  optional string orignal_token = 15;
  //shared_secret
  optional string shared_secret = 16;
  optional CompanionRegData regdata = 17;
  optional string verifyed_name = 18;
}

message RegisterParams {
  required string cc = 1;
  required string phone = 2;
  required bytes  regid = 3;
  required bytes identity = 4;
  required bytes skey_id = 5;
  required bytes skey_val = 6;
  required bytes skey_sig = 7;
  optional string code = 8;
}


message ClientHello
{
  optional bytes ephemeral_ = 1; //第一次登陆时临时生成的一个公钥
  optional bytes static_ = 2;
  optional bytes payload_ = 3;
}

message ServerHello
{
  optional bytes ephemeral_ = 1; //第一次登陆时临时生成的一个公钥
  optional bytes static_ = 2;
  optional bytes payload_ = 3;
}

message ClientFinish
{
  optional bytes static_ = 1;
  optional bytes payload_ = 2;
}

message HandshakeMessage
{
  optional ClientHello clientHello_ = 2;
  optional ServerHello serverHello_ = 3;
  optional ClientFinish clientFinish_ = 4;
}



message NoiseCertificate
{
  optional bytes details_ = 1;
  optional bytes signature_ = 2;


  message Details{
    optional uint32 serial = 1;
    optional string issuer = 2;
    optional uint64 expires = 3;
    optional string subject = 4;
    optional bytes key = 5;
  }
}

message CertificateDetails
{
  optional int32 serial_ = 1;
  optional string issuer_ = 2;
  optional int64 expires_ = 3;
  optional string subject_ = 4;
  optional bytes  key = 5;
}

message WebInfo{
  optional string ref_token = 1;
  optional string version = 2;
  optional WebdPayload webd_payload = 3;

  message WebdPayload{
    optional bool uses_participant_in_key = 1;
    optional bool supports_starred_messages = 2 [deprecated = true];
    optional bool supports_document_messages = 3 [deprecated = true];
    optional bool supports_url_messages = 4 [deprecated = true];
    optional bool supports_media_retry = 5 [deprecated = true];
    optional bool supports_e2e_image = 6 [deprecated = true];
    optional bool supports_e2e_video = 7 [deprecated = true];
    optional bool supports_e2e_audio = 8 [deprecated = true];
    optional bool supports_e2e_document = 9 [deprecated = true];
    optional string document_types = 10 [deprecated = true];
    optional bytes features = 11;
  }
}

enum ConnectType
{
  CELLULAR_UNKNOWN = 0;
  WIFI_UNKNOWN = 1;
  CELLULAR_EDGE = 100;
  CELLULAR_IDEN = 101;
  CELLULAR_UMTS = 102;
  CELLULAR_EVDO = 103;
  CELLULAR_GPRS = 104;
  CELLULAR_HSDPA = 105;
  CELLULAR_HSUPA = 106;
  CELLULAR_HSPA = 107;
  CELLULAR_CDMA = 108;
  CELLULAR_1XRTT = 109;
  CELLULAR_EHRPD = 110;
  CELLULAR_LTE = 111;
  CELLULAR_HSPAP = 112;
}

enum ConnectReason
{
  PUSH = 0;
  USER_ACTIVATED = 1;
  SCHEDULED = 2;
  ERROR_RECONNECT = 3;
  NETWORK_SWITCH = 4;
  PING_RECONNECT = 5;
}

enum iosAppExtension
{
  SHARE_EXTENSION = 0;
  SERVICE_EXTENSION = 1;
  NTENTS_EXTENSION = 2;
}

