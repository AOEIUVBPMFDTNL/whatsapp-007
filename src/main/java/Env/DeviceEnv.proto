message DNSSource{
  optional DNSResolutionMethod dns_method = 15;
  optional bool app_cached = 16;

  enum DNSResolutionMethod{
    SYSTEM = 0;
    GOOGLE = 1;
    HARDCODED = 2;
    OVERRIDE = 3;
    FALLBACK = 4;
  }
}

message CompanionRegData{
  optional bytes e_regid = 1;
  optional bytes e_keytype = 2;
  optional bytes e_ident = 3;
  optional bytes e_skey_id = 4;
  optional bytes e_skey_val = 5;
  optional bytes e_skey_sig = 6;
  optional bytes build_hash = 7;
  optional bytes companion_props = 8;
}

enum Product {
  WHATSAPP = 0;
  MESSENGER = 1;
  INTEROP = 2;
  INTEROP_MSGR = 3;
}

message ClientPayload
{
  optional int64 username_ = 1;
  optional bool passive_ = 3;
  repeated int32 clientFeatures_ = 4;
  optional UserAgent userAgent_ = 5;
  optional WebInfo webInfo_ = 6;
  optional string pushName = 7;
  optional fixed32 sessionId_ = 9;
  optional bool shortConnect_ = 10;
  optional ConnectType connectType_ = 12;
  optional ConnectReason connectReason_ = 13;
  repeated fixed32 shards = 14;
  optional DNSSource dns = 15;
  optional int32  connect_attempt_count = 16;
  optional int32  agent = 17;
  optional int32  device = 18;
  optional CompanionRegData reg_data = 19;
  optional Product product = 20;
  optional bool  oc = 23; //是否正常版本 true
  optional int32 connectionLc = 24;
  optional iosAppExtension iosAppExtension_ = 30;
  optional bool pull = 33;
  optional int32 memoryTotal = 36;
  optional int32 memoryClass = 37;
}